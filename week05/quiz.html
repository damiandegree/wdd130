<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1> Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <div class="for-item">
                <label for="q1">What does the acronyms HTML stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>
            <div class="for-item"><label for="q2">How are id and class attributes selected in
                    CSS?</label>
                <textarea name="q2" id="q2" rows="4"></textarea>
            </div>
            <div class="for-item"><label for="q3">Which of the following options do not need a
                    closer tag?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one</option>
                    <option value="img">IMG</option>
                    <option value="h1">H1</option>
                    <option value="p">P</option>
                    <option value="body">BODY</option>
                </select>
            </div>
            <div class="for-item">
                <label for="q4">What does the following code?</label>
                <code>* { margin: 0; padding: 0; box-sizing: border-box; }</code>
                <input type="text" name="q4" id="q4">
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>HTML and CSS | Matiasd Martinez | 2026</footer>
</body>

</html>
