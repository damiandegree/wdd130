<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Poll Form</title>
    <link rel="stylesheet" href="styles/poll.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2"><label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="name" required>
                </div>
                <div class="form-item column2"><label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>
            <fieldset class="questions">
                <legend>Questions</legend>
                <div class="form-item column1"><label for="browser">What is your favorite
                        browser?</label>
                    <select name="browser" id="browser">
                        <option value="select">Options</option>
                        <option value="chrome">Chrome</option>
                        <option value="mozilla">Mozilla</option>
                        <option value="brave">Brave</option>
                        <option value="edge">Edge</option>
                    </select>
                </div>

                <div class="form-item column1"><label for="pet">Do you have a household
                        pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <label for="feedback" class="textarea-label">List the place you have
                    lived</label>
                <textarea name="feedback" id="feedback"
                  placeholder="Buenos Aires, Bahia Blanca, Olavarria, etc" rows="4"></textarea>

            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>HTML form activity | Matias Martinez | 2026</footer>
</body>

</html>
