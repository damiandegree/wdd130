<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description"
      content="You can contact us through this page, send your info and send opinions or any answer" />
    <meta name="author" content="Martinez Matias" />
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.jpg" alt="rafting adventure logo">
        <nav>
            <a href="index.html">Home</a>

            <a href="about.html">About
                Us</a>
            <a href="trips.html">Trips</a>

            <a href="contact.html">Contact
                Us</a>
        </nav>
    </header>
    <main>
        <article class="contact-info">
            <h1>Rafting Adventure Company</h1>
            <ul>
                <li>123 Main River Street</li>
                <li>Kolob, California</li>
                <li><a href="tel:+19999999999">+1 999 999 999</a></li>
                <li><a href="mailto:info@raftingadventure.com"> info@raftingadventure.com</a>
                </li>
            </ul>
        </article>
        <section class="section1">
            <div class="map-item">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d348305.39233434515!2d-114.36199818783615!3d34.22547337446858!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sar!4v1775531761836!5m2!1ses-419!2sar"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>
                <div class="fullname-box"><label for="fullname">Name </label>
                    <input type="text" id="fullname" name="name" required>
                </div>
                <div class="useremail-box"><label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
                <div class="message-purpose-box">
                    <p>Message Purpose</p>
                    <fieldset>
                        <div><input type="radio" name="inquiry" id="inquiry">
                            <label for="inquiry">General Inquiry</label>
                        </div>
                        <div> <input type="radio" name="reservation" id="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div><input type="radio" id="suggestion" name="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>
                </div>

                <div class="message-box"><label for="message" class="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here"></textarea>
                </div>
                <div class="newsletter-box">
                    <input type="checkbox" id="newsletter" name="newsletter"><label
                      for="newsletter">Please
                        Suscribe
                        me to the monthlyly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section class="section2">

            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/shadow-profile.jpg" alt="dos balsas sin usar" class="image">
                <figcaption>Larry Larson</figcaption>
            </figure>
            <figure>
                <img src="images/shadow-profile.jpg" alt="security helmets" class="image">
                <figcaption>Mattew Martins</figcaption>
            </figure>
            <figure>
                <img src="images/shadow-profile.jpg" alt="a group of people doing rafting"
                  class="image">
                <figcaption>Kevin Kingston</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>© | 2026 | Rafting Adventure | Matias Martinez </p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook-icon.png"
                  alt="Facebook Icon"></a>
            <a href="https://www.linkedin.com/"><img src="images/linkedin-icon.png"
                  alt="Linkedin Icon"></a>
            <a href="https://web.whatsapp.com/"><img src="images/whatsapp-icon.png"
                  alt="Whatsapp Icon"></a>
        </nav>
    </footer>

</body>

</html>
